<!doctype html><html><head><meta charset="utf-8"><title>{{title}} | {{app_name}}</title><style>body{font-family:Arial;margin:0;background:#f3f6f8}nav{background:#263238;padding:12px 20px}nav a{color:#fff;margin-right:14px}.wrap{max-width:1150px;margin:22px auto}.card{background:#fff;border:1px solid #d9e0e3;padding:15px;margin:10px 0;border-radius:8px}table{width:100%;border-collapse:collapse;background:white}th,td{border:1px solid #ddd;padding:8px}input,select,textarea,button{padding:8px;margin:3px}</style></head><body><nav><a href="{{url_for('homes')}}">HomePulse</a>{% if session.user_id %}{% if session.role in ['monitor','admin','installer'] %}<a href="{{url_for('monitor_alerts')}}">Monitoring</a>{% endif %}<a href="{{url_for('logout')}}">Logout ({{session.name}})</a>{% else %}<a href="{{url_for('login')}}">Login</a>{% endif %}</nav><main class="wrap">{% for c,m in get_flashed_messages(with_categories=true) %}<div class="card">{{m}}</div>{% endfor %}{% block content %}{% endblock %}</main></body></html>
